<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe; #4facfe; #00c6ff; #0072ff; #00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe; #00f2fe; #7F00FF; #E100FF; #4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #00f2fe; letter-spacing: 1.5px; text-transform: uppercase; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #f8fafc; }
      .card-val { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-weight: 700; font-size: 22px; fill: #38bdf8; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
      
      @keyframes pulse {
        0%%, 100%% { opacity: 0.8; transform: scale(1); }
        50%% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes flowPacket {
        0%% { stroke-dashoffset: 600; }
        100%% { stroke-dashoffset: 0; }
      }
      .pulse-circle { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .stream-line { stroke-dasharray: 8 12; animation: dash 25s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="180" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />
  <circle cx="600" cy="400" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Waveform Lines in Background -->
  <path d="M 0 320 Q 200 240, 400 310 T 800 270 T 1200 300" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="stream-line" />
  <path d="M 0 350 Q 300 280, 600 360 T 1200 330" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="2" stroke-dasharray="6 10" style="animation: dash 35s linear infinite;" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Content Container -->
  <g transform="translate(80, 50)">
    <!-- Badge -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#10b981" class="pulse-circle" />
      <text x="32" y="20" class="tagline">⚡ LIVE API OBSERVABILITY HUD</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title">Awesome API Analytics Platform 📊</text>

    <!-- Subtitle -->
    <text x="0" y="135" class="subtitle">Curated Guide to API Observability, Gateways, Metrics, Tracing &amp; Monetization</text>

    <!-- Interactive Metric HUD Cards -->
    <g transform="translate(0, 175)">
      <!-- Card 1: Traffic -->
      <g transform="translate(0, 0)">
        <rect width="240" height="110" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
        <rect x="18" y="18" width="8" height="8" rx="4" fill="#00f2fe" />
        <text x="34" y="26" class="card-title">Traffic Telemetry</text>
        <text x="18" y="66" class="card-val">2.84B <tspan font-size="14" fill="#64748b">req/mo</tspan></text>
        <text x="18" y="92" class="card-sub">▲ 99.999% Reliability</text>
      </g>

      <!-- Card 2: Latency -->
      <g transform="translate(260, 0)">
        <rect width="240" height="110" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
        <rect x="18" y="18" width="8" height="8" rx="4" fill="#10b981" />
        <text x="34" y="26" class="card-title">P99 Tail Latency</text>
        <text x="18" y="66" class="card-val" fill="#10b981">14.2 <tspan font-size="14" fill="#64748b">ms</tspan></text>
        <text x="18" y="92" class="card-sub">▼ -4.3ms vs baseline</text>
      </g>

      <!-- Card 3: Stack -->
      <g transform="translate(520, 0)">
        <rect width="240" height="110" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" />
        <rect x="18" y="18" width="8" height="8" rx="4" fill="#8b5cf6" />
        <text x="34" y="26" class="card-title">Ecosystem Stack</text>
        <text x="18" y="66" class="card-val" fill="#c084fc">OpenTelemetry</text>
        <text x="18" y="92" class="card-sub">Traces + Metrics + Logs</text>
      </g>

      <!-- Card 4: Analytics DB -->
      <g transform="translate(780, 0)">
        <rect width="260" height="110" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" />
        <rect x="18" y="18" width="8" height="8" rx="4" fill="#f59e0b" />
        <text x="34" y="26" class="card-title">Analytics Engine</text>
        <text x="18" y="66" class="card-val" fill="#fbbf24">ClickHouse &amp; OLAP</text>
        <text x="18" y="92" class="card-sub">Sub-second high-cardinality</text>
      </g>
    </g>

    <!-- Bottom Footer Tags -->
    <g transform="translate(0, 318)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
        GATEWAYS • DISTRIBUTED TRACING • HIGH-CARDINALITY ANALYTICS • MONETIZATION • AI OBSERVABILITY • OPEN SOURCE
      </text>
    </g>
  </g>
</svg>
